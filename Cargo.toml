[package]
name = "auditkit"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
colored = "3.0"
indicatif = "0.18"
regex = "1.12"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
serde_json = "1.0"
url = "2.5"

[dev-dependencies]
tempfile = "3.23"
